name: Daily Auto Movie Crawler

on:
  schedule:
    # Runs at 00:00 UTC (7:00 AM ICT) every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Auto Movie Crawler
        run: python auto_crawl.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json daily_status.md crawl_log.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-crawl update movies database [skip ci]" && git push)
