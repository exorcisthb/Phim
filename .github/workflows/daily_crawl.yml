name: Daily Auto Movie Crawler

on:
  schedule:
    # Chạy lúc 17:00 UTC (00:00 ICT - nửa đêm giờ Hà Nội) mỗi ngày
    - cron: '0 17 * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ GitHub Actions UI

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Run Daily Crawler (Immutable DB - Append Only)
        run: python auto_daily_crawler.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json movie_changes_report.xlsx
          git diff --quiet && git diff --staged --quiet || git commit -m "🤖 [Auto] Cập nhật phim mới $(date +'%Y-%m-%d')"
          git push
